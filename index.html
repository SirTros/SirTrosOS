<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Charging UI</title>
    <style>
        :root {
            --ios-green: #30d158;
            --nav-gray: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        /* Horní lišta */
        #status-bar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 30px;
            box-sizing: border-box;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        /* Spodní lišta - Android Style */
        #nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            display: none;
            justify-content: space-around;
            align-items: center;
            padding: 0 50px;
            box-sizing: border-box;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .nav-svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--nav-gray);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 150;
        }

        .hidden { display: none !important; }
        .transparent { opacity: 0 !important; }

        /* Magsafe Container s Fade-in */
        #magsafe-container {
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

        #magsafe-container.active {
            display: flex !important;
            opacity: 1;
            animation: magsafeExit 0.8s cubic-bezier(0.4, 0, 1, 1) forwards 4.2s;
        }

        .ring-box {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.12);
            stroke-width: 28;
            transform-origin: center;
            animation: ringErupt 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.1) forwards;
        }

        .progress {
            fill: none;
            stroke: var(--ios-green);
            stroke-width: 28;
            stroke-linecap: round;
            stroke-dasharray: 880;
            stroke-dashoffset: 880;
            transform: rotate(-90deg);
            transform-origin: center;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1);
            filter: drop-shadow(0 0 12px rgba(48, 209, 88, 0.4));
        }

        /* Zakulacený blesk */
        .bolt-svg {
            position: absolute;
            width: 90px;
            height: 90px;
            fill: var(--ios-green);
            opacity: 0;
            animation: boltPop 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.2) forwards 0.1s;
        }

        .status-label {
            margin-top: 40px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeIn 0.4s ease-out forwards 0.3s;
        }

        /* Animace */
        @keyframes ringErupt {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes boltPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes magsafeExit {
            0% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.1); filter: blur(30px); }
        }
    </style>
</head>
<body>

    <button id="start-btn">START</button>
    <audio id="chargeSound" src="charging.wav" preload="auto"></audio>

    <div id="status-bar">
        <div id="clock">00:00</div>
        <div id="battery-status">100% 🔋</div>
    </div>

    <div id="magsafe-container">
        <div class="ring-box">
            <svg width="400" height="400">
                <circle class="track" cx="200" cy="200" r="140"></circle>
                <circle id="bar" class="progress" cx="200" cy="200" r="140"></circle>
            </svg>
            <!-- Zakulacený blesk -->
            <svg class="bolt-svg" viewBox="0 0 24 24">
                <path d="M12.5,2L5.5,13H11L10.5,22L18.5,11H13L12.5,2Z" stroke="var(--ios-green)" stroke-width="1" stroke-linejoin="round" />
            </svg>
        </div>
        <div class="status-label" id="status-text">0% Nabíjím</div>
    </div>

    <div id="nav-bar">
        <!-- Ikona III -->
        <svg class="nav-svg" viewBox="0 0 24 24">
            <line x1="7" y1="5" x2="7" y2="19" />
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="17" y1="5" x2="17" y2="19" />
        </svg>
        <!-- Ikona O -->
        <svg class="nav-svg" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" />
        </svg>
        <!-- Ikona < -->
        <svg class="nav-svg" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6" />
        </svg>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusBar = document.getElementById('status-bar');
        const navBar = document.getElementById('nav-bar');
        const container = document.getElementById('magsafe-container');
        const bar = document.getElementById('bar');
        const text = document.getElementById('status-text');
        const sound = document.getElementById('chargeSound');
        const clockEl = document.getElementById('clock');
        const battEl = document.getElementById('battery-status');
        
        let timer;
        let audioUnlocked = false;

        function updateStatus() {
            const now = new Date();
            clockEl.textContent = now.getHours().toString().padStart(2, '0') + ':' + 
                                 now.getMinutes().toString().padStart(2, '0');

            navigator.getBattery().then(batt => {
                const level = Math.round(batt.level * 100);
                battEl.textContent = level + "% " + (batt.charging ? "⚡" : "🔋");
            });
        }
        setInterval(updateStatus, 1000);

        startBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            sound.play().then(() => { sound.pause(); sound.currentTime = 0; audioUnlocked = true; }).catch(() => {});
            startBtn.classList.add('hidden');
            statusBar.style.display = 'flex';
            navBar.style.display = 'flex';
            updateStatus();
        });

        async function triggerMagsafe() {
            if (!audioUnlocked) return;
            const battery = await navigator.getBattery();
            
            sound.currentTime = 0;
            sound.play().catch(() => {});

            statusBar.classList.add('transparent');
            navBar.classList.add('transparent');

            container.classList.remove('active');
            void container.offsetWidth; 
            
            bar.style.strokeDashoffset = '880';
            text.textContent = Math.round(battery.level * 100) + '% Nabíjím';
            container.classList.add('active');

            setTimeout(() => {
                bar.style.strokeDashoffset = 880 - (880 * battery.level);
            }, 150);

            clearTimeout(timer);
            timer = setTimeout(() => {
                container.classList.remove('active');
                statusBar.classList.remove('transparent');
                navBar.classList.remove('transparent');
            }, 5000);
        }

        navigator.getBattery().then(battery => {
            battery.addEventListener('chargingchange', () => { if (battery.charging) triggerMagsafe(); });
            if (battery.charging) {
                startBtn.addEventListener('click', () => { setTimeout(triggerMagsafe, 600); }, { once: true });
            }
        });
    </script>
</body>
</html>
