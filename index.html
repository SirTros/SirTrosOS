<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        /* Horní lišta */
        #status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 25px;
            display: none; /* Skryté do Startu */
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            z-index: 50;
            transition: opacity 0.5s;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
        }

        .hidden { display: none !important; }
        .no-cursor { cursor: none; }
        .transparent { opacity: 0; }

        #magsafe-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .active {
            display: flex !important;
            animation: magsafeDisappear 0.8s cubic-bezier(0.4, 0, 1, 1) forwards 4.2s;
        }

        .ring-box {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.16);
            stroke-width: 32;
            opacity: 0;
            transform-origin: center;
            animation: grayErupt 0.35s cubic-bezier(0.1, 0.9, 0.3, 1) forwards;
        }

        .progress {
            fill: none;
            stroke: #30d158;
            stroke-width: 32;
            stroke-linecap: round;
            stroke-dasharray: 880;
            stroke-dashoffset: 880;
            transform: rotate(-90deg);
            transform-origin: center;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.1, 0.5, 0.1, 1);
            filter: drop-shadow(0 0 18px rgba(48, 209, 88, 0.4));
        }

        .bolt-svg {
            position: absolute;
            width: 115px; 
            height: 115px;
            fill: #30d158;
            stroke: #30d158;
            stroke-width: 2.5;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 20px rgba(48, 209, 88, 0.55));
            opacity: 0;
            animation: boltPop 0.35s cubic-bezier(0.1, 0.9, 0.3, 1.2) forwards;
        }

        .status-label {
            margin-top: 45px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            opacity: 0;
            animation: fadeInText 0.3s ease-out forwards 0.2s;
        }

        @keyframes grayErupt { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes boltPop { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeInText { to { opacity: 1; } }
        @keyframes magsafeDisappear {
            0% { opacity: 1; filter: blur(0); transform: scale(1); }
            100% { opacity: 0; filter: blur(50px); transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <button id="start-btn">START FULLSCREEN</button>
    <audio id="chargeSound" src="charging.wav" preload="auto"></audio>

    <div id="status-bar">
        <div id="clock">00:00</div>
        <div id="battery-status">100% 🔋</div>
    </div>

    <div id="magsafe-container">
        <div class="ring-box">
            <svg width="400" height="400">
                <circle class="track" cx="200" cy="200" r="140"></circle>
                <circle id="bar" class="progress" cx="200" cy="200" r="140"></circle>
            </svg>
            <svg class="bolt-svg" viewBox="0 0 32 32">
                <path d="M19,2 L7,18 L14,18 L13,30 L25,14 L18,14 L19,2 Z"></path>
            </svg>
        </div>
        <div class="status-label" id="status-text">0% Charging...</div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusBar = document.getElementById('status-bar');
        const container = document.getElementById('magsafe-container');
        const bar = document.getElementById('bar');
        const text = document.getElementById('status-text');
        const sound = document.getElementById('chargeSound');
        const clockEl = document.getElementById('clock');
        const battEl = document.getElementById('battery-status');
        
        let timer;
        let audioUnlocked = false;

        // Aktualizace hodin a baterie v liště
        function updateStatus() {
            const now = new Date();
            clockEl.textContent = now.getHours().toString().padStart(2, '0') + ':' + 
                                 now.getMinutes().toString().padStart(2, '0');

            navigator.getBattery().then(batt => {
                const level = Math.round(batt.level * 100);
                let emoji = "";
                
                if (batt.charging) {
                    emoji = "⚡";
                } else {
                    emoji = level > 20 ? "🔋" : "🪫";
                }
                
                battEl.textContent = level + "% " + emoji;
            });
        }
        setInterval(updateStatus, 1000);

        startBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            sound.play().then(() => { sound.pause(); sound.currentTime = 0; audioUnlocked = true; }).catch(() => {});
            
            startBtn.classList.add('hidden');
            statusBar.style.display = 'flex';
            document.body.classList.add('no-cursor');
            updateStatus();
        });

        async function triggerMagsafe() {
            if (!audioUnlocked) return;
            const battery = await navigator.getBattery();
            
            sound.currentTime = 0;
            sound.play().catch(() => {});

            // Skrýt stavovou lištu během animace
            statusBar.classList.add('transparent');

            container.classList.remove('active');
            void container.offsetWidth; 
            bar.style.strokeDashoffset = '880';
            text.textContent = Math.round(battery.level * 100) + '% Charging...';
            container.classList.add('active');

            setTimeout(() => {
                bar.style.strokeDashoffset = 880 - (880 * battery.level);
            }, 100);

            clearTimeout(timer);
            timer = setTimeout(() => {
                container.classList.remove('active');
                statusBar.classList.remove('transparent'); // Znovu ukázat lištu
            }, 5000);
        }

        navigator.getBattery().then(battery => {
            battery.addEventListener('chargingchange', () => { if (battery.charging) triggerMagsafe(); });
            if (battery.charging) {
                startBtn.addEventListener('click', () => { setTimeout(triggerMagsafe, 600); }, { once: true });
            }
        });
    </script>
</body>
</html>
