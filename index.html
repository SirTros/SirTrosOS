<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magsafe UI</title>
    <style>
        :root {
            --ios-green: #30d158;
            --nav-white: #ffffff;
        }

        body {
            background-color: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Landscape Protection */
        #portrait-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        @media (orientation: landscape) {
            #portrait-warning { display: flex; }
            #status-bar, #nav-bar, #magsafe-container, #start-btn { display: none !important; }
        }

        /* Top Bar - Pushed to the absolute top */
        #status-bar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 5px 35px; /* Minimal top padding */
            box-sizing: border-box;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        /* Bottom Nav - Close together and white */
        #nav-bar {
            position: fixed;
            bottom: 4px;
            width: 100%;
            height: 60px;
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 0 85px; 
            box-sizing: border-box;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .nav-svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--nav-white);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #start-btn {
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background-color: #fff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            z-index: 150;
        }

        .hidden { display: none !important; }
        .transparent { opacity: 0 !important; }

        /* Magsafe Animation */
        #magsafe-container {
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #magsafe-container.active {
            display: flex !important;
            opacity: 1;
            animation: magsafeExit 0.8s cubic-bezier(0.4, 0, 1, 1) forwards 4.2s;
        }

        .ring-box {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.12);
            stroke-width: 30;
        }

        .progress {
            fill: none;
            stroke: var(--ios-green);
            stroke-width: 30;
            stroke-linecap: round;
            stroke-dasharray: 880;
            stroke-dashoffset: 880;
            transform: rotate(-90deg);
            transform-origin: center;
            transition: stroke-dashoffset 1.4s cubic-bezier(0.2, 1, 0.3, 1);
            filter: drop-shadow(0 0 15px rgba(48, 209, 88, 0.4));
        }

        .bolt-svg {
            position: absolute;
            width: 95px;
            height: 95px;
            fill: var(--ios-green);
            opacity: 0;
            animation: boltPop 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.2) forwards 0.1s;
        }

        .status-label {
            margin-top: 40px;
            font-size: 34px;
            font-weight: 700;
            opacity: 0;
            animation: fadeIn 0.4s ease-out forwards 0.3s;
        }

        @keyframes boltPop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes magsafeExit {
            0% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.06); filter: blur(40px); }
        }
    </style>
</head>
<body>

    <div id="portrait-warning">
        <h2>Please rotate your device</h2>
        <p>Portrait mode only.</p>
    </div>

    <button id="start-btn">START</button>
    <audio id="chargeSound" src="charging.wav" preload="auto"></audio>

    <div id="status-bar">
        <div id="clock">00:00</div>
        <div id="battery-status">100% 🔋</div>
    </div>

    <div id="magsafe-container">
        <div class="ring-box">
            <svg width="400" height="400">
                <circle class="track" cx="200" cy="200" r="140"></circle>
                <circle id="bar" class="progress" cx="200" cy="200" r="140"></circle>
            </svg>
            <svg class="bolt-svg" viewBox="0 0 24 24">
                <path d="M12.5,2L5.5,13H11L10.5,22L18.5,11H13L12.5,2Z" stroke-linejoin="round" />
            </svg>
        </div>
        <div class="status-label" id="status-text">0% Charging</div>
    </div>

    <div id="nav-bar">
        <svg class="nav-svg" viewBox="0 0 24 24"><line x1="7" y1="5" x2="7" y2="19" /><line x1="12" y1="5" x2="12" y2="19" /><line x1="17" y1="5" x2="17" y2="19" /></svg>
        <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /></svg>
        <svg class="nav-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusBar = document.getElementById('status-bar');
        const navBar = document.getElementById('nav-bar');
        const container = document.getElementById('magsafe-container');
        const bar = document.getElementById('bar');
        const text = document.getElementById('status-text');
        const sound = document.getElementById('chargeSound');
        const clockEl = document.getElementById('clock');
        const battEl = document.getElementById('battery-status');
        
        let wakeLock = null;
        let timer;
        let audioUnlocked = false;

        // Function to keep screen on
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`${err.name}, ${err.message}`);
            }
        }

        function updateStatus() {
            const now = new Date();
            clockEl.textContent = now.getHours().toString().padStart(2, '0') + ':' + 
                                 now.getMinutes().toString().padStart(2, '0');

            navigator.getBattery().then(batt => {
                const level = Math.round(batt.level * 100);
                battEl.textContent = level + "% " + (batt.charging ? "⚡" : "🔋");
            });
        }
        setInterval(updateStatus, 1000);

        startBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
            
            // Activate screen-on and orientation lock
            requestWakeLock();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }

            sound.play().then(() => { sound.pause(); sound.currentTime = 0; audioUnlocked = true; }).catch(() => {});
            startBtn.classList.add('hidden');
            statusBar.style.display = 'flex';
            navBar.style.display = 'flex';
            updateStatus();
        });

        async function triggerMagsafe() {
            if (!audioUnlocked) return;
            const battery = await navigator.getBattery();
            
            sound.currentTime = 0;
            sound.play().catch(() => {});

            statusBar.classList.add('transparent');
            navBar.classList.add('transparent');

            container.classList.remove('active');
            void container.offsetWidth; 
            
            bar.style.strokeDashoffset = '880';
            text.textContent = Math.round(battery.level * 100) + '% Charging';
            container.classList.add('active');

            setTimeout(() => {
                bar.style.strokeDashoffset = 880 - (880 * battery.level);
            }, 100);

            clearTimeout(timer);
            timer = setTimeout(() => {
                container.classList.remove('active');
                statusBar.classList.remove('transparent');
                navBar.classList.remove('transparent');
            }, 5000);
        }

        navigator.getBattery().then(battery => {
            battery.addEventListener('chargingchange', () => { if (battery.charging) triggerMagsafe(); });
            if (battery.charging) {
                startBtn.addEventListener('click', () => { setTimeout(triggerMagsafe, 500); }, { once: true });
            }
        });

        // Re-request wake lock if tab becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
